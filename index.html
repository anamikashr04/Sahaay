<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sahaay Care</title>
<meta name="theme-color" content="#0B2E1F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
/* Layout: one phone-sized app (390×844) shown in a device bezel on a dark stage; on a real phone it fills the screen. */
:root{
  --stage:#101814; --stage-fg:#9fb5a8;
  --cream:#F5F4EF; --forest:#0B2E1F; --mint:#E3F3EA; --glow:#4FE8A0; --peach:#FBE8D8;
  --orange:#E8842C;--cta:#B85C15;--orange-text:#9A4A0E; --red:#D9534F; --ink:#1C2B23;
  --serif:var(--sans);
  --sans:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
#root{height:100%}
body{background:var(--stage);color:var(--stage-fg);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}

.stage{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.caption{font-size:13px;letter-spacing:.04em;text-align:center;max-width:390px;line-height:1.5}
.caption b{color:#dfe9e3;font-weight:800}
.device{width:414px;height:min(868px,calc(100vh - 90px));min-height:640px;border-radius:56px;background:#0a0a0a;padding:12px;box-shadow:0 0 0 2px #2a2f2c,0 40px 80px -20px rgba(0,0,0,.7);position:relative;flex:none}
.notch{position:absolute;top:22px;left:50%;transform:translateX(-50%);width:118px;height:32px;background:#000;border-radius:20px;z-index:60}
.notch::after{content:"";position:absolute;right:16px;top:10px;width:12px;height:12px;border-radius:50%;background:#16202b}

/* ---------- App tokens (light) ---------- */
.app{--bg:var(--cream);--surface:#fff;--text:var(--ink);--muted:#4F5F56;--label:#2E4A3B;--warn:#9A4A0E;--line:#E7E4DA;--soft:#EEECE4;--head:var(--forest);--chip:#fff;
  width:100%;height:100%;border-radius:44px;overflow:hidden;background:var(--bg);color:var(--text);position:relative;display:flex;flex-direction:column;transition:background .4s,color .4s}
.app.night{--bg:#0B2E1F;--surface:#113B2A;--text:#F1F7F3;--muted:#B3CCBE;--label:#BFE6D0;--warn:#F6BC86;--line:#24543F;--soft:#123F2C;--head:#0E3524;--chip:#12402D}
.statusbar{height:50px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 6px;font-size:12px;font-weight:800;background:var(--head);color:#dbe8e0;font-variant-numeric:tabular-nums}
.statusbar .r{display:flex;gap:6px;align-items:center}
.batt{width:22px;height:11px;border:1.5px solid currentColor;border-radius:3px;position:relative;padding:1px}
.batt i{display:block;height:100%;width:78%;background:currentColor;border-radius:1px}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:rgba(127,140,130,.4) transparent;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{width:4px}.scroll::-webkit-scrollbar-thumb{background:rgba(127,140,130,.4);border-radius:4px}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:130px;height:5px;border-radius:3px;background:var(--text);opacity:.35;z-index:70;pointer-events:none}

/* header */
.hdr{background:var(--head);color:#F3F7F4;padding:10px 20px 22px;border-radius:0 0 28px 28px;position:relative}
.hdr-top{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font-weight:900;font-size:15px;flex:none}
.brand{flex:1;min-width:0;line-height:1}
.brand b{font-weight:800;font-size:20px;display:block}
.brand small{font-size:11px;font-weight:700;letter-spacing:.06em;color:#BFE6D0}
.ibtn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center;transition:background .2s,transform .15s}
.ibtn:active{transform:scale(.92)}
.ibtn.hot{background:var(--orange)}
.quote{font-size:19px;font-weight:700;line-height:1.35;margin:16px 0 8px;text-wrap:balance}
.mission{font-size:12px;font-weight:700;letter-spacing:.04em;color:#BFE6D0;display:flex;align-items:center;gap:6px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--glow);box-shadow:0 0 0 0 rgba(79,232,160,.6);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(79,232,160,0)}100%{box-shadow:0 0 0 0 rgba(79,232,160,0)}}
.rolechip{display:inline-flex;align-items:center;gap:6px;margin-top:12px;background:rgba(255,255,255,.1);border-radius:999px;padding:6px 12px 6px 9px;font-size:13px;font-weight:700;color:#EAF4EE}

/* role menu */
.menu{position:absolute;left:12px;right:12px;top:58px;background:#0E3524;border:1px solid #1d5a40;border-radius:22px;padding:14px 10px 10px;z-index:40;box-shadow:0 24px 50px -10px rgba(0,0,0,.55);animation:drop .22s ease-out}
@keyframes drop{from{opacity:0;transform:translateY(-8px)}}
.menu-h{display:flex;justify-content:space-between;padding:0 8px 10px;font-size:12px;font-weight:800;letter-spacing:.04em;color:#BFE6D0}
.menu-h i{font-style:normal;font-weight:600;color:#A9C4B5}
.ropt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px;border-radius:14px;color:#F3F7F4;transition:background .15s}
.ropt:hover{background:rgba(255,255,255,.05)}
.ropt.on{background:var(--orange)}
.ropt .ic{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.08);display:grid;place-items:center;flex:none}
.ropt.on .ic{background:rgba(255,255,255,.22)}
.ropt b{font-size:15px;font-weight:800;display:block}
.ropt small{font-size:12.5px;opacity:.85;display:block;line-height:1.3}
.reset{display:flex;align-items:center;gap:6px;margin:8px auto 0;font-size:12.5px;font-weight:700;color:#A9C4B5;padding:6px 10px}
.scrim{position:absolute;inset:0;background:rgba(5,15,10,.45);z-index:30;animation:fade .2s}
@keyframes fade{from{opacity:0}}

/* body sections */
.body{padding:20px 18px 40px;display:flex;flex-direction:column;gap:22px}
.sec{display:flex;flex-direction:column;gap:10px}
.eyebrow{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:16px;font-weight:800;color:var(--text);line-height:1.3}
.sheet-h .eyebrow{font-size:13px;font-weight:700;color:var(--muted)}
.eyebrow .live{color:var(--warn);display:flex;align-items:center;gap:4px;font-size:13px;font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px}
.mintcard{background:var(--mint);color:var(--ink);border-radius:22px;padding:6px 16px}
.peachcard{background:var(--peach);color:var(--ink)}
.statrow{display:flex;justify-content:space-between;align-items:baseline;padding:13px 0;border-bottom:1px solid rgba(11,46,31,.09)}
.statrow:last-child{border-bottom:0}
.statrow span{font-size:14px;font-weight:700;color:#2E4A3B}
.statrow b{font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--cta);color:#fff;font-size:14.5px;font-weight:800;padding:13px 18px;min-height:46px;border-radius:999px;transition:transform .12s,filter .2s}
.btn:hover{filter:brightness(1.05)}.btn:active{transform:scale(.97)}
.btn.sm{padding:8px 14px;font-size:13px;min-height:38px}
.btn.block{width:100%}
.btn.ghost{background:transparent;color:var(--text);border:1.5px solid var(--line)}
.btn.green{background:var(--forest);color:#fff}
.night .btn.green{background:var(--glow);color:var(--forest)}
.btn.redo{background:transparent;color:var(--red);border:1.5px solid rgba(217,83,79,.35)}
.btn:disabled{opacity:.4;pointer-events:none}
.arrows{display:flex;gap:4px}
.arrows button{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:var(--text)}
.arrows button:hover{background:var(--soft)}

/* needs carousel */
.carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -18px;padding:2px 18px 4px;scroll-padding:0 18px}
.carousel::-webkit-scrollbar{display:none}
.need{flex:0 0 100%;scroll-snap-align:start;border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:10px;color:var(--ink);background:var(--mint)}
.need.peach{background:var(--peach)}
.need-top{display:flex;justify-content:space-between;align-items:center}
.cat{display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;color:#3D5246}
.need h3{font-weight:800;font-size:20px;margin:0;line-height:1.3}
.need p{margin:0;font-size:14px;line-height:1.55;color:#3D4D44}
.nums{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:#2E3F35;font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:7px;background:rgba(11,46,31,.1);overflow:hidden}
.bar i{display:block;height:100%;background:var(--orange);border-radius:7px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.bar.g i{background:#2f9e6a}
.night .bar.dk{background:rgba(255,255,255,.1)}
.night .bar.dk i{background:var(--glow)}
.pct{text-align:right;font-size:13px;font-weight:800;color:#9A4A0E;margin-top:-4px}
.dots{display:flex;justify-content:center;gap:5px}
.dots i{width:6px;height:6px;border-radius:6px;background:var(--line);transition:all .25s}
.dots i.on{width:18px;background:var(--cta)}

/* badges */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;letter-spacing:.01em;padding:4px 9px;border-radius:999px;white-space:nowrap}
.b-critical{background:var(--cta);color:#fff}
.b-crit2{background:#FDE3D6;color:#C25E15;border:1px solid #F6C6A6}
.b-high{background:#FFF1E2;color:#9A4A0E;border:1px solid #F7D7B5}
.b-normal{background:#E7F2EC;color:#2F6B4F;border:1px solid #CFE6D9}
.b-pending{background:#FFF4D6;color:#8A6411;border:1px solid #F1DFA6}
.b-approved{background:#E3F3EA;color:#20734B;border:1px solid #BFE3CE}
.b-ready{background:var(--forest);color:var(--glow)}
.b-declined{background:#FBE3E2;color:#B03A36;border:1px solid #F1C3C1}
.b-open{background:#FBE3E2;color:#B03A36}
.b-progress{background:#FFF1E2;color:#9A4A0E}
.b-resolved{background:#E3F3EA;color:#20734B}
.night .b-approved{background:rgba(79,232,160,.12);color:var(--glow);border-color:rgba(79,232,160,.3)}
.night .b-ready{background:var(--glow);color:var(--forest)}
.night .b-pending{background:rgba(232,132,44,.16);color:#F6BC86;border-color:rgba(232,132,44,.35)}
.night .b-resolved{background:rgba(79,232,160,.12);color:var(--glow)}
.night .b-open{background:rgba(232,132,44,.2);color:#F6BC86}

/* list rows */
.row{display:flex;gap:12px;align-items:flex-start}
.row .grow{flex:1;min-width:0}
.t{font-weight:800;font-size:15px;line-height:1.35}
.s{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.45}
.ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--mint);color:var(--forest)}
.ico.p{background:var(--peach);color:#9A4A0E}
.night .ico{background:rgba(79,232,160,.12);color:var(--glow)}
.night .ico.p{background:rgba(232,132,44,.16);color:#F4B57A}
.list{display:flex;flex-direction:column;gap:10px}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;flex-wrap:wrap;color:var(--muted);font-variant-numeric:tabular-nums}

/* tabs */
.tabs{display:flex;background:var(--soft);border-radius:14px;padding:4px;gap:4px}
.tabs button{flex:1;padding:10px 2px;border-radius:10px;font-size:12.5px;font-weight:800;color:var(--muted);position:relative;transition:all .2s}
.tabs button.on{background:var(--forest);color:var(--glow)}
.tabs .n{position:absolute;top:-6px;right:2px;min-width:19px;height:19px;border-radius:10px;background:var(--cta);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 4px}
.seg{display:flex;gap:4px;margin-top:10px}
.seg button{flex:1;font-size:12px;font-weight:800;padding:8px 2px;border-radius:9px;border:1px solid var(--line);color:var(--muted)}
.seg button.on.o{background:#FBE3E2;color:#B03A36;border-color:#F1C3C1}
.seg button.on.ip{background:#FFF1E2;color:#9A4A0E;border-color:#F7D7B5}
.seg button.on.r{background:#E3F3EA;color:#20734B;border-color:#BFE3CE}
.prio{width:4px;align-self:stretch;border-radius:4px;flex:none}

/* wizard */
.steps{display:flex;gap:6px}
.steps i{flex:1;height:4px;border-radius:4px;background:var(--line)}
.steps i.on{background:var(--cta)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13.5px;font-weight:700;color:var(--text)}
.inp{width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--muted);background:var(--surface);color:var(--text);font-size:15px}
.inp:focus{outline:none;border-color:var(--orange)}
textarea.inp{resize:none;min-height:72px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border-radius:999px;border:1.5px solid var(--line);font-size:13.5px;min-height:40px;font-weight:700;display:inline-flex;gap:6px;align-items:center;transition:all .15s;background:var(--chip)}
.chip.on{background:var(--forest);border-color:var(--forest);color:var(--glow)}
.night .chip.on{background:var(--glow);border-color:var(--glow);color:var(--forest)}
.tiers{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tiers button{padding:12px 0;border-radius:14px;border:1.5px solid var(--line);font-weight:900;font-size:15px;font-variant-numeric:tabular-nums}
.tiers button.on{border-color:var(--cta);background:#FFF1E2;color:#9A4A0E}

/* modal sheet */
.modal{position:absolute;inset:0;z-index:80;display:flex;align-items:flex-end;background:rgba(5,15,10,.5);animation:fade .2s}
.sheet{width:100%;max-height:88%;overflow-y:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:10px 20px 34px;display:flex;flex-direction:column;gap:16px;animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40%);opacity:.4}}
.grip{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sheet-h h2{font-weight:800;font-size:21px;margin:4px 0 0;line-height:1.3}
.impact{background:var(--mint);color:var(--ink);border-radius:16px;padding:12px 14px;font-size:14px;line-height:1.5;display:flex;gap:10px;align-items:flex-start}

/* night monitor */
.wing{display:flex;flex-direction:column;gap:9px}
.stepper{display:flex;align-items:center;gap:8px;font-weight:900;font-variant-numeric:tabular-nums;font-size:13px}
.stepper button{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line)}
.stepper button.plus{background:var(--cta);border-color:var(--cta);color:#fff}
.check{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 0;border-bottom:1px solid var(--line);font-size:15px;font-weight:600;min-height:48px}
.check:last-child{border-bottom:0}
.check .box{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--muted);display:grid;place-items:center;flex:none;margin-left:auto;transition:all .15s}
.check.done span{text-decoration:line-through;color:var(--muted)}
.check.done .box{background:var(--glow);border-color:var(--glow);color:var(--forest)}
.contacts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.contact{border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:4px;text-decoration:none;border:1.5px solid}
.contact.pol{border-color:rgba(217,83,79,.45);color:#F08F8B;background:rgba(217,83,79,.08)}
.contact.med{border-color:rgba(232,132,44,.5);color:#F4B57A;background:rgba(232,132,44,.1)}
.app:not(.night) .contact.pol{color:var(--red)}
.app:not(.night) .contact.med{color:#9A4A0E}
.contact b{font-size:14px;display:flex;justify-content:space-between;align-items:center}
.contact span{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}

.banner{background:var(--forest);color:#EAF4EE;border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.night .banner{background:#134731}
.banner h3{font-weight:800;font-size:19px;margin:0;line-height:1.3}
.banner p{margin:0;font-size:14px;color:#CFE3D7;line-height:1.5}
.banner .glyph{position:absolute;right:-12px;bottom:-16px;opacity:.12;color:var(--glow)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:4px}
.kpi small{font-size:13px;font-weight:700;opacity:.85}
.kpi b{font-weight:800;font-size:24px;font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:18px;color:var(--muted);font-size:14px;border:1.5px dashed var(--line);border-radius:18px}
.note{font-size:13px;line-height:1.5;color:var(--muted)}
.hscroll{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:0 18px}
.hscroll::-webkit-scrollbar{display:none}
.prog{flex:0 0 72%;border-radius:20px;padding:15px;display:flex;flex-direction:column;gap:8px;color:var(--ink)}

.toast{position:absolute;left:16px;right:16px;bottom:30px;z-index:90;background:var(--forest);color:#EAF4EE;border:1px solid #1d5a40;border-radius:16px;padding:12px 14px;font-size:14px;font-weight:700;display:flex;gap:10px;align-items:center;animation:up .25s ease-out;box-shadow:0 12px 30px -8px rgba(0,0,0,.4)}
.toast svg{color:var(--glow);flex:none}

/* staff dashboard, inventory, parent simple mode, website page */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:118px;transition:transform .12s,border-color .2s}
.tile:hover{border-color:var(--muted)}.tile:active{transform:scale(.98)}
.tile b{font-size:15px;line-height:1.25}.tile small{font-size:13px;color:var(--muted);font-weight:600}
.tile-top{display:flex;justify-content:space-between;align-items:flex-start}
.reddot{width:12px;height:12px;border-radius:50%;background:var(--red);box-shadow:0 0 0 3px rgba(217,83,79,.18);flex:none;display:inline-block}
.reddot.sm{width:8px;height:8px;box-shadow:none}
.greendot{width:12px;height:12px;border-radius:50%;background:#2f9e6a;flex:none;display:inline-block}
.back{display:inline-flex;align-items:center;gap:4px;font-weight:800;font-size:15px;color:var(--text);padding:6px 4px;margin-left:-4px}
.pindots{display:flex;gap:14px;justify-content:center}
.pindots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted)}
.pindots i.on{background:var(--text);border-color:var(--text)}
.keypad{display:grid;grid-template-columns:repeat(3,72px);gap:12px;justify-content:center}
.keypad button{height:60px;border-radius:50%;background:var(--soft);font-size:22px;font-weight:800;display:grid;place-items:center;color:var(--text)}
.keypad button:active{background:var(--line)}
.bigtiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bigtile{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:18px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-height:150px;justify-content:center}
.bigtile:active{transform:scale(.98)}
.bigtile .ico{width:60px;height:60px;border-radius:18px}
.bigtile b{font-size:17px;line-height:1.2}
.bigtile span[lang]{font-size:16px;color:var(--muted);font-weight:700}
.bigtile.wide{flex-direction:row;min-height:0;justify-content:flex-start;gap:14px;padding:16px;width:100%}
.bigtile.wide>span:last-child{display:flex;flex-direction:column;gap:2px}
.webwrap{min-height:100vh;background:var(--cream);color:var(--ink)}
.app.web{height:auto;min-height:100vh;border-radius:0;overflow:visible}
.webhdr{background:var(--forest);color:#F3F7F4;display:flex;align-items:center;gap:10px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.webmain{max-width:620px;margin:0 auto;padding-block:28px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.webh1{font-size:26px;font-weight:900;line-height:1.2;margin:4px 0 0;text-wrap:balance}
.logo img{width:26px;height:26px;object-fit:contain;display:block}
.logo{background:#FFFDF7}
@media (max-width:520px){
  .stage{padding:0;gap:0;justify-content:stretch;height:100%}
  .caption,.notch{display:none}
  .device{width:100%;height:100%;min-height:0;border-radius:0;padding:0;box-shadow:none;background:transparent;flex:1}
  .app{border-radius:0}
  .statusbar{display:none}
  .homebar{display:none}
  .hdr{padding-top:14px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------------- Contributor ---------------- */
function Contributor({st,openDonate}){
  const ref=useRef(null);const [idx,setIdx]=useState(0);
  const needs=st.needs;
  const fulfilled=Math.round(needs.reduce((a,n)=>a+pctOf(n),0)/needs.length);
  const go=d=>{const el=ref.current;if(!el)return;const i=Math.max(0,Math.min(needs.length-1,idx+d));el.scrollTo({left:i*(el.clientWidth-36+12),behavior:'smooth'})};
  const onScroll=()=>{const el=ref.current;if(el)setIdx(Math.round(el.scrollLeft/(el.clientWidth-36+12)))};
  return html`<div className="body">
    <div className="sec">
      <div className="eyebrow">Our achievements <span className="live"><${Icon} n="heart" s=${12}/> Live impact</span></div>
      <div className="mintcard">
        <div className="statrow"><span>Hours volunteered</span><b>${st.stats.hours.toLocaleString('en-US')}h</b></div>
        <div className="statrow"><span>Families helped</span><b>${st.stats.families}</b></div>
        <div className="statrow"><span>Needs fulfilled</span><b>${Math.max(fulfilled,0)}%</b></div>
      </div>
    </div>
    <div className="sec">
      <div className="eyebrow">Urgent needs carousel <div className="arrows"><button onClick=${()=>go(-1)} aria-label="Previous need"><${Icon} n="chevL"/></button><button onClick=${()=>go(1)} aria-label="Next need"><${Icon} n="chevR"/></button></div></div>
      <div className="carousel" ref=${ref} onScroll=${onScroll}>
        ${needs.map((n,i)=>html`<article key=${n.id} className=${'need'+(i%2?' peach':'')}>
          <div className="need-top">${urgBadge(n.urgency)}<span className="cat"><${Icon} n=${CAT[n.category]?.ic||'box'} s=${12}/>${CAT[n.category]?.label||n.category}</span></div>
          <h3>${n.title}</h3><p>${n.desc}</p>
          <div className="nums"><span>Raised: ${fmtAmt(n,n.raised)}</span><span>Target: ${fmtAmt(n,n.target)}</span></div>
          <div className="bar"><i style=${{width:pctOf(n)+'%'}}></i></div>
          <div className="pct">${pctOf(n)}% Fulfilled</div>
          <button className="btn block" onClick=${()=>openDonate(n.id)} disabled=${pctOf(n)>=100}><${Icon} n="gift" s=${14}/>${pctOf(n)>=100?'Fully funded':'Support this need'}</button>
        </article>`)}
      </div>
      <div className="dots">${needs.map((n,i)=>html`<i key=${n.id} className=${i===idx?'on':''}></i>`)}</div>
    </div>
    <div className="sec">
      <div className="eyebrow">Centres are running low on <span className="live">Live from inventory</span></div>
      ${st.inventory.filter(i=>i.procure).length?html`<div className="card" style=${{padding:'4px 16px'}}>${st.inventory.filter(i=>i.procure).map(i=>html`<div key=${i.id} style=${{display:'flex',gap:10,alignItems:'center',padding:'11px 0',borderBottom:'1px solid var(--line)'}}>
        <span className="reddot sm"></span><span style=${{flex:1,fontWeight:700}}>${i.name}</span><span className="s" style=${{marginTop:0}}>${i.centre}</span></div>`)}</div>`
        :html`<div className="empty">Everything is in stock right now.</div>`}
      <div className="note">Prefer not to install the app? <a href="#query" style=${{color:'var(--text)',fontWeight:800}}>Send a query from the website</a> and the team will get back to you.</div>
    </div>
    <div className="sec">
      <div className="eyebrow">Continue where you left off</div>
      <div className="card list">
        <div className="row"><div className="ico"><${Icon} n="droplet"/></div><div className="grow"><div className="t">Monthly Nutrition Sponsor</div><div className="s">Month 3 of 6 · Wing B families</div><div className="bar g" style=${{marginTop:8}}><i style=${{width:'50%'}}></i></div></div></div>
        <div className="row"><div className="ico p"><${Icon} n="book"/></div><div className="grow"><div className="t">Learning Desk Book Drive</div><div className="s">42 of 60 books delivered</div><div className="bar" style=${{marginTop:8}}><i style=${{width:'70%'}}></i></div></div></div>
      </div>
    </div>
    <div className="sec">
      <div className="eyebrow">Recent gifts</div>
      <div className="list">${st.donations.slice(0,4).map(d=>html`<div key=${d.id} className="card row" style=${{padding:'12px 14px'}}>
        <div className="ico"><${Icon} n="heart" s=${15}/></div><div className="grow"><div className="t">${d.name} gave $${d.amount}</div><div className="s">${d.need}</div></div><div className="s">${d.ago}</div></div>`)}</div>
    </div>
  </div>`;
}
function DonateSheet({need,onClose,onDonate}){
  const [tier,setTier]=useState(30);const [custom,setCustom]=useState('');const [name,setName]=useState('');
  const amt=custom!==''?Math.max(0,Number(custom)||0):tier;
  const units=need.unit==='usd'?amt:Math.floor(amt/need.unitCost);
  const after=Math.min(need.target,need.raised+units);
  return html`<${Sheet} title=${need.title} eyebrow="Support this need" onClose=${onClose}>
    <div className="tiers">${[15,30,50,100].map(t=>html`<button key=${t} className=${custom===''&&tier===t?'on':''} onClick=${()=>{setTier(t);setCustom('')}}>$${t}</button>`)}</div>
    <${Field} label="Custom amount ($)"><input id="d-custom" className="inp" inputMode="numeric" placeholder="Enter any amount" value=${custom} onChange=${e=>setCustom(e.target.value.replace(/[^0-9]/g,''))}/></${Field}>
    <${Field} label="Donor name"><input id="d-name" className="inp" placeholder="Your name (or leave blank)" value=${name} onChange=${e=>setName(e.target.value)}/></${Field}>
    <div className="impact"><${Icon} n="sparkles" s=${18}/><div>
      <b>Your $${amt} ${need.unit==='usd'?'adds $'+amt:'provides '+units+' '+need.unit}</b> to ${need.title.toLowerCase()} at ${need.location}.<br/>
      Progress moves from ${pctOf(need)}% to ${Math.round(after/need.target*100)}%.</div></div>
    <button className="btn block" disabled=${units<=0} onClick=${()=>onDonate(need.id,amt,units,name.trim()||'Anonymous')}><${Icon} n="heart" s=${14}/>Give $${amt}</button>
  </${Sheet}>`;
}

const INTERESTS=['Nutrition Support','Hygiene Kit Assembly','Tutoring','Maintenance','Shelter Assistance','Special Events'];

function Volunteer({st,act,setRole,openWorkshop}){
  const me=st.myVolunteerProfile;
  const [step,setStep]=useState(1);const [f,setF]=useState({name:'',email:'',interests:[],availability:[]});
  const tog=(k,v)=>setF(p=>({...p,[k]:p[k].includes(v)?p[k].filter(x=>x!==v):[...p[k],v]}));
  if(!me||me.status==='declined'){
    const ok1=f.name.trim().length>1&&/\S+@\S+\.\S+/.test(f.email);
    return html`<div className="body">
      ${me&&me.status==='declined'?html`<div className="card" style=${{borderColor:'rgba(217,83,79,.35)'}}><div className="t">Your last application was declined</div><div className="s">Staff could not verify it this time. You can update your details and apply again.</div></div>`:null}
      <div className="banner"><div className="glyph"><${Icon} n="users" s=${110} w=${1.5}/></div><h3>Become a Sahaay volunteer</h3><p>Three quick steps. Staff verify every volunteer before their first shift with the children.</p></div>
      <div className="steps">${[1,2,3].map(i=>html`<i key=${i} className=${i<=step?'on':''}></i>`)}</div>
      ${step===1&&html`<div className="sec"><div className="eyebrow">Step 1 · Identification</div>
        <${Field} label="Full name"><input id="v-name" className="inp" placeholder="e.g. Ananya Rao" value=${f.name} onChange=${e=>setF({...f,name:e.target.value})}/></${Field}>
        <${Field} label="Email address"><input id="v-email" className="inp" type="email" placeholder="you@example.com" value=${f.email} onChange=${e=>setF({...f,email:e.target.value})}/></${Field}>
        <button className="btn block" disabled=${!ok1} onClick=${()=>setStep(2)}>Continue <${Icon} n="chevR" s=${14}/></button></div>`}
      ${step===2&&html`<div className="sec"><div className="eyebrow">Step 2 · Focus areas</div>
        <div className="chips">${INTERESTS.map(i=>html`<button key=${i} className=${'chip'+(f.interests.includes(i)?' on':'')} onClick=${()=>tog('interests',i)}>${f.interests.includes(i)&&html`<${Icon} n="check" s=${12} w=${3}/>`}${i}</button>`)}</div>
        <div style=${{display:'flex',gap:8,marginTop:6}}><button className="btn ghost" onClick=${()=>setStep(1)}>Back</button><button className="btn" style=${{flex:1}} disabled=${!f.interests.length} onClick=${()=>setStep(3)}>Continue <${Icon} n="chevR" s=${14}/></button></div></div>`}
      ${step===3&&html`<div className="sec"><div className="eyebrow">Step 3 · Commitment</div>
        <div className="chips">${AVAIL.map(i=>html`<button key=${i} className=${'chip'+(f.availability.includes(i)?' on':'')} onClick=${()=>tog('availability',i)}>${f.availability.includes(i)&&html`<${Icon} n="check" s=${12} w=${3}/>`}${i}</button>`)}</div>
        <div style=${{display:'flex',gap:8,marginTop:6}}><button className="btn ghost" onClick=${()=>setStep(2)}>Back</button><button className="btn" style=${{flex:1}} disabled=${!f.availability.length} onClick=${()=>{act.applyVolunteer(f);setStep(1)}}><${Icon} n="send" s=${14}/>Submit application</button></div></div>`}
    </div>`;
  }
  if(me.status==='pending') return html`<div className="body">
    <div className="card" style=${{textAlign:'center',padding:'26px 18px',display:'flex',flexDirection:'column',gap:10,alignItems:'center'}}>
      <div className="ico p" style=${{width:56,height:56,borderRadius:18}}><${Icon} n="clock" s=${26}/></div>
      <span className="badge b-pending">Awaiting staff verification</span>
      <div style=${{fontSize:22}}>Thank you, ${me.name.split(' ')[0]}</div>
      <div className="note">Your profile is in the staff approval queue. To try the full flow, switch to the <b>Staff</b> role, approve your profile under Approvals, then come back here.</div>
      <button className="btn green" onClick=${()=>setRole('staff')}><${Icon} n="shield" s=${14}/>Switch to Staff</button>
    </div>
    <div className="card"><div className="eyebrow" style=${{marginBottom:8}}>Your application</div>
      <div className="s">${me.email}</div><div className="chips" style=${{marginTop:10}}>${[...me.interests,...me.availability].map(i=>html`<span key=${i} className="chip" style=${{padding:'6px 10px',fontSize:13}}>${i}</span>`)}</div></div>
  </div>`;
  const mine=st.workshops.filter(w=>w.mine);
  return html`<div className="body">
    <div className="banner"><div className="glyph"><${Icon} n="star" s=${110} w=${1.5}/></div>
      <span className="badge b-ready" style=${{alignSelf:'flex-start'}}><${Icon} n="check" s=${10} w=${3}/>Verified volunteer</span>
      <h3>Welcome back, ${me.name.split(' ')[0]}</h3><p>Specialising in ${me.interests.join(', ')} · ${me.availability.join(', ')}</p></div>
    <div className="kpis">
      <div className="kpi" style=${{background:'var(--mint)',color:'var(--ink)'}}><small>Hours served</small><b>${me.hours} hrs</b></div>
      <div className="kpi" style=${{background:'var(--peach)',color:'var(--ink)'}}><small>Rank</small><b>Silver</b><div style=${{fontSize:12.5,fontWeight:700,opacity:.8}}>${(25-me.hours).toFixed(1)} hrs to Gold</div></div>
    </div>
    <div className="sec"><div className="eyebrow">Next shift</div>
      <div className="card row"><div className="ico"><${Icon} n="cal"/></div><div className="grow"><div className="t">${me.interests[0]}</div><div className="s">${me.availability[0]} · Wing B Learning Desk</div></div><span className="badge b-approved">Confirmed</span></div></div>
    <${Polls} st=${st} act=${act} who="Volunteer"/>
    <div className="sec"><div className="eyebrow">My history</div>
      ${st.activity.filter(a=>a.text.includes(me.name)).length?html`<div className="card" style=${{padding:'4px 16px'}}>${st.activity.filter(a=>a.text.includes(me.name)).slice(0,6).map(a=>html`<div key=${a.id} style=${{display:'flex',gap:12,padding:'10px 0',borderBottom:'1px solid var(--line)',fontSize:14}}><span style=${{color:'var(--muted)',fontWeight:800,minWidth:84,fontVariantNumeric:'tabular-nums'}}>${a.date}</span><span style=${{flex:1}}>${a.text}</span></div>`)}</div>`
        :html`<div className="empty">Your approvals, workshops and shifts will be listed here.</div>`}</div>
    <div className="sec"><div className="eyebrow">My workshop proposals <button className="btn sm" onClick=${openWorkshop}><${Icon} n="plus" s=${12} w=${3}/>Propose</button></div>
      ${mine.length?html`<div className="list">${mine.map(w=>html`<div key=${w.id} className="card row"><div className="ico p"><${Icon} n="book"/></div><div className="grow"><div className="t">${w.title}</div><div className="s">${w.category} · ${fmtWhen(w.when)}</div></div><span className=${'badge '+(w.status==='approved'?'b-approved':w.status==='rejected'?'b-declined':'b-pending')}>${w.status}</span></div>`)}</div>`
      :html`<div className="empty">Share a skill with the children. Propose a class and staff will review it; approved classes show up for parents.</div>`}
    </div>
  </div>`;
}

function PinLock({onUnlock}){
  const [pin,setPin]=useState('');const [err,setErr]=useState(false);
  const press=d=>{if(pin.length>=4)return;const p=pin+d;setPin(p);setErr(false);
    if(p.length===4){if(p===STAFF_PIN)setTimeout(onUnlock,150);else setTimeout(()=>{setPin('');setErr(true)},250)}};
  return html`<div className="body" style=${{alignItems:'center',textAlign:'center'}}>
    <div className="ico" style=${{width:56,height:56,borderRadius:18}}><${Icon} n="lock" s=${26}/></div>
    <div><div className="t" style=${{fontSize:18}}>Staff sign-in</div><div className="s">Use your own phone. Enter your 4-digit PIN to open the staff side.</div></div>
    <div className="pindots" aria-label=${pin.length+' of 4 digits entered'}>${[0,1,2,3].map(i=>html`<i key=${i} className=${i<pin.length?'on':''}></i>`)}</div>
    ${err?html`<div className="s" style=${{color:'var(--red)',marginTop:0}}>That PIN didn't match. Try again.</div>`:null}
    <div className="keypad">${['1','2','3','4','5','6','7','8','9','','0','del'].map((k,i)=>k===''?html`<span key=${i}></span>`:html`<button key=${i} onClick=${()=>k==='del'?setPin(pin.slice(0,-1)):press(k)} aria-label=${k==='del'?'Delete digit':k}>${k==='del'?html`<${Icon} n="chevL" s=${20}/>`:k}</button>`)}</div>
    <div className="note">Demo PIN: 1234</div>
  </div>`;
}

const ISSUES=[
  {id:'fever',label:'Fever',ic:'flame',kind:'child'},
  {id:'breath',label:'Breathing trouble',ic:'alert',kind:'child',emergency:true},
  {id:'vomit',label:'Vomiting / loose motions',ic:'droplet',kind:'child'},
  {id:'bleed',label:'Bleeding / injury',ic:'med',kind:'child'},
  {id:'seizure',label:'Fainting / fits',ic:'alert',kind:'child',emergency:true},
  {id:'pain',label:'Pain / discomfort',ic:'heart',kind:'child'},
  {id:'scared',label:"Scared / can't sleep",ic:'moon',kind:'child'},
  {id:'facility',label:'Power, water or room issue',ic:'wrench',kind:'facility'},
];
const GUIDE={
  fever:{steps:['Check the temperature with the thermometer and note the time.','Children on cancer treatment can get serious infections quickly, so tell on-call staff about any fever.','Give water or ORS in small sips.','Keep clothing light and wipe the forehead with a damp cloth.',"Give only medicines your child's doctor has prescribed."],help:'Call 108 or go to the hospital if the child is shivering hard, very drowsy, or the doctor said to come in for any fever.'},
  breath:{steps:['Call 108 now.','Sit the child upright and loosen tight clothing.','Keep the room airy. Stay calm and keep the child calm.','Do not give food or drink.'],help:'This is an emergency. Call 108 first, then raise the alert.'},
  vomit:{steps:['Give ORS or water in small sips every few minutes.','If the child is drowsy, lay them on their side.','Note how many times it has happened.','Keep the child clean and change their clothes.'],help:"Get help now if there is blood, the child can't keep any fluids down, or is very drowsy."},
  bleed:{steps:['Press a clean cloth firmly on the spot and keep holding.','For a nosebleed, sit the child up, lean them forward and pinch the soft part of the nose.','Children on treatment may bleed more easily. Tell on-call staff.'],help:"Call 108 if bleeding doesn't stop with firm pressure, or if the head is hurt."},
  seizure:{steps:['Call 108 now.','Lay the child on their side on the floor, away from hard objects.','Do not put anything in their mouth or hold them down.','Note when it started and how long it lasts.'],help:'This is an emergency. Call 108 first, then raise the alert.'},
  pain:{steps:['Ask where it hurts and how bad it is, from 0 to 10.','Help the child into a comfortable position.','Give only pain medicine the doctor prescribed, at the prescribed time.'],help:'Get help if the pain is severe, sudden, or keeps getting worse.'},
  scared:{steps:['Stay close, keep a dim light on and speak softly.','Try a familiar routine: a story, a song, holding hands.','If the child seems unwell or in pain, raise a health alert instead.'],help:'Raise a "can wait" alert if you want staff to check in at 10 AM.'},
  facility:{steps:['Move children away from any danger: sparks, water on the floor, broken glass.','If the power is out, use the torch kept in the room.','Your report goes to the morning repair list automatically.'],help:'If there is fire, smoke or a gas smell, leave the room and call 112.'},
};

        <button className="ibtn" style=${{background:'var(--soft)',color:'var(--text)'}} onClick=${()=>act.removeHandover(x.id)} aria-label=${'Remove note for '+x.child}><${Icon} n="x" s=${14}/></button></div>`)}</div>
      <div className="card" style=${{display:'flex',flexDirection:'column',gap:10}}>
        <${Field} label="Child"><div className="chips">${st.children.map(c=>html`<button key=${c} className=${'chip'+(h.child===c?' on':'')} onClick=${()=>setH({...h,child:c})}>${c}</button>`)}</div></${Field}>
        <${Field} label="Risk tonight"><div className="chips">${['High','Medium','Low'].map(r=>html`<button key=${r} className=${'chip'+(h.risk===r?' on':'')} onClick=${()=>setH({...h,risk:r})}>${r}</button>`)}</div></${Field}>

/* ---------------- App ---------------- */
function App(){
  const [st,setSt]=useState(load);
  const [menu,setMenu]=useState(false);
  const [modal,setModal]=useState(null);
  const [toast,setToast]=useState(null);
  const [clock,setClock]=useState(()=>new Date());
  const [confirmReset,setConfirmReset]=useState(false);
  const [unlocked,setUnlocked]=useState(false);
  useEffect(()=>{const f=e=>{if(e.key===KEY)setSt(load())};window.addEventListener('storage',f);return()=>window.removeEventListener('storage',f)},[]);
  const scrollRef=useRef(null);
  useEffect(()=>save(st),[st]);
  useEffect(()=>{const t=setInterval(()=>setClock(new Date()),20000);return()=>clearInterval(t)},[]);
  useEffect(()=>{if(!toast)return;const t=setTimeout(()=>setToast(null),2600);return()=>clearTimeout(t)},[toast]);
  const up=fn=>setSt(s=>{const n=JSON.parse(JSON.stringify(s));fn(n);return n});
  const say=m=>setToast(m);
  const low=st.isLowLight===null?(st.role==='night'||isNightHour()):st.isLowLight;
  const setRole=r=>{up(s=>{s.role=r;if(r==='night'&&s.isLowLight===false)s.isLowLight=null});setMenu(false);scrollRef.current&&scrollRef.current.scrollTo({top:0})};

  const L=(s,cat,text,who)=>{s.activity.unshift({id:uid(),date:today(),time:nowTime(),cat,text,who});if(s.activity.length>300)s.activity.length=300};
  const act={
    donate(id,amt,units,name){up(s=>{const n=s.needs.find(x=>x.id===id);n.raised=Math.min(n.target,n.raised+units);s.donations.unshift({id:uid(),name,amount:amt,need:n.title,ago:'Just now'});L(s,'Donations',name+' gave $'+amt+' to '+n.title,'Contributor')});setModal(null);say(`Thank you! $${amt} added to ${st.needs.find(x=>x.id===id).title}.`)},
    applyVolunteer(f){up(s=>{const me={id:'me',...f,name:f.name.trim(),status:'pending',hours:18.5};s.myVolunteerProfile=me;s.volunteers=s.volunteers.filter(v=>v.id!=='me');s.volunteers.unshift({...me});L(s,'Volunteers','Volunteer application from '+me.name,'Volunteer')});say('Application sent to staff for verification.')},
    reviewVolunteer(id,status){up(s=>{const v=s.volunteers.find(x=>x.id===id);v.status=status;if(id==='me'&&s.myVolunteerProfile)s.myVolunteerProfile.status=status;L(s,'Volunteers',v.name+(status==='approved'?' approved as a volunteer':' application declined'),'Staff')});say(status==='approved'?'Volunteer approved. Their dashboard is now unlocked.':'Application declined.')},
    proposeWorkshop(f){up(s=>{const by=s.myVolunteerProfile?.name||'Volunteer';s.workshops.push({id:uid(),...f,title:f.title.trim(),by,status:'pending',mine:true});L(s,'Volunteers','Workshop proposed: '+f.title.trim()+' ('+by+')','Volunteer')});setModal(null);say('Workshop sent to staff for review.')},
    reviewWorkshop(id,status){up(s=>{const w=s.workshops.find(x=>x.id===id);w.status=status;L(s,'Volunteers','Workshop '+status+': '+w.title+' ('+w.by+')','Staff')});say(status==='approved'?'Workshop approved. Parents can now see it.':'Workshop rejected.')},
    setMaint(id,status){up(s=>{const m=s.maintenance.find(x=>x.id===id);if(m.status!==status)L(s,'Repairs',(m.kind||'Repair')+' "'+m.title+'" marked '+status,'Staff');m.status=status})},
    addRepair(f){up(s=>{s.maintenance.unshift({id:uid(),title:f.title.trim(),area:f.area.trim()||s.centre,priority:f.priority,status:'Open',source:'Staff',kind:f.kind||'Repair'});L(s,'Repairs',(f.kind||'Repair')+' logged: '+f.title.trim(),'Staff')});setModal(null);say('Added to the log.')},
    postNeed(f){up(s=>{s.needs.unshift({id:uid(),title:f.title.trim(),category:f.category,urgency:f.urgency,unit:'usd',unitCost:1,raised:0,target:+f.target,location:f.location.trim()||s.centre,desc:f.desc.trim()||'Newly posted by staff.'});L(s,'Donations','Need posted for donors: '+f.title.trim(),'Staff')});setModal(null);say('Need published to contributors.')},
    requestAid(f){up(s=>{const who=f.recipient.trim()||'Family';s.familyRequests.unshift({id:uid(),type:f.type,recipient:who,date:today(),status:'Pending',by:f.by||'Parent'});L(s,'Families',f.type+' requested for '+who+(f.by==='Staff'?' (raised by staff)':''),f.by||'Parent')});setModal(null);say(f.by==='Staff'?'Request raised for the parent.':'Request sent. · माँग भेज दी गई।')},
    callMe(f){up(s=>{s.queries.unshift({id:uid(),name:'Parent (app)',contact:'',type:'Call back',centre:s.centre,msg:'Please call me about: '+f.topic.toLowerCase()+'.',source:'App (parent)',status:'New',date:today()});L(s,'Queries','Parent asked for a call back ('+f.topic+')','Parent')});setModal(null);say('Staff will call you back. · स्टाफ़ आपको कॉल करेगा।')},
    setFamily(id,status){up(s=>{const r=s.familyRequests.find(x=>x.id===id);r.status=status;if(status==='Ready')r.room='Room 2';L(s,'Families',r.type+' for '+r.recipient+(status==='Ready'?' ready for pickup in Room 2':' approved'),'Staff')});say(status==='Ready'?'Family notified: ready for pickup in Room 2.':'Request approved.')},
    setParentSimple(v){up(s=>{s.parentSimple=v})},
    setCentre(c){up(s=>{s.centre=c})},
    invMove(f){up(s=>{const i=s.inventory.find(x=>x.id===f.id);const q=+f.qty;if(f.dir==='in'){i.qty+=q;i.inStock=true;i.procure=false}else{i.qty=Math.max(0,i.qty-q);if(i.qty===0)i.inStock=false}
      s.register.unshift({id:uid(),dir:f.dir,item:i.name,qty:q,unit:i.unit,centre:i.centre,date:today(),note:f.note.trim()});
      L(s,'Inventory',(f.dir==='in'?'Inward: ':'Outward: ')+q+' '+i.unit+' '+i.name+' at '+i.centre+(f.note.trim()?' ('+f.note.trim()+')':''),'Staff')});setModal(null);say('Entry saved to the register.')},
    invAdd(n){const id='i'+uid();up(s=>{s.inventory.push({id,name:n.name.trim(),unit:n.unit.trim()||'units',qty:0,inStock:false,procure:false,centre:s.centre});L(s,'Inventory','New item added: '+n.name.trim()+' at '+s.centre,'Staff')});return id},
    invToggleStock(id){up(s=>{const i=s.inventory.find(x=>x.id===id);i.inStock=!i.inStock;L(s,'Inventory',i.name+' marked '+(i.inStock?'available':'not available')+' at '+i.centre,'Staff')})},
    invToggleProcure(id){up(s=>{const i=s.inventory.find(x=>x.id===id);i.procure=!i.procure;L(s,'Inventory',i.name+(i.procure?' marked to procure again':' procured')+' at '+i.centre,'Staff')});say('Inventory updated.')},
    invPostNeed(id){up(s=>{const i=s.inventory.find(x=>x.id===id);s.needs.unshift({id:uid(),fromItem:id,title:i.name+' restock',category:/soap|pad|hygiene/i.test(i.name)?'hygiene':/ors|medic/i.test(i.name)?'medical':/note|book/i.test(i.name)?'education':'nutrition',urgency:'high',unit:'usd',unitCost:1,raised:0,target:500,location:i.centre,desc:i.centre+' needs to restock '+i.name.toLowerCase()+'. Posted from the inventory register.'});L(s,'Donations','Asked donors for '+i.name+' ('+i.centre+')','Staff')});say('Posted to contributors.')},
    queryReply(id,text){up(s=>{const q=s.queries.find(x=>x.id===id);q.reply=text;q.status='Replied';L(s,'Queries','Replied to '+q.name+' ('+q.type+')','Staff')});say('Reply sent.')},
    queryClose(id){up(s=>{const q=s.queries.find(x=>x.id===id);q.status='Closed';L(s,'Queries','Closed query from '+q.name,'Staff')})},
    addPoll(f){up(s=>{s.polls.unshift({id:uid(),q:f.q.trim(),aud:f.aud,yes:0,no:0,votes:{}});L(s,'Polls','Poll sent to '+f.aud.toLowerCase()+': '+f.q.trim(),'Staff')});setModal(null);say('Poll sent.')},
    vote(id,choice,who){up(s=>{const p=s.polls.find(x=>x.id===id);p.votes=p.votes||{};const prev=p.votes[who];if(prev===choice)return;if(prev)p[prev]--;p[choice]++;p.votes[who]=choice;L(s,'Polls',who+' answered '+choice+': '+p.q,who)})},
    raiseAlert(f){const is=issueOf(f.issue);const t=nowTime();up(s=>{s.alerts.unshift({id:uid(),issue:f.issue,child:f.child,place:f.place,urgency:f.urgency,note:f.note.trim(),time:t,status:'sent'});s.nightLogs.unshift({id:uid(),time:t,text:'Alert raised: '+is.label+(f.child?' · '+f.child:'')+(f.place?' · '+f.place:''),who:'Parent'});L(s,'Night','Alert raised: '+is.label+(f.child?' · '+f.child:''),'Parent');if(is.kind==='facility')s.maintenance.unshift({id:uid(),title:f.note.trim()||is.label,area:f.place||'Campus',priority:f.urgency==='urgent'?'High':'Medium',status:'Open',source:'Night Care',kind:'Repair'})});setModal(null);say(is.kind==='facility'?'Alert sent. Also added to the morning repair list.':'Alert sent to on-call staff.')},
    alertReply(id,text){const t=nowTime();up(s=>{const a=s.alerts.find(x=>x.id===id);a.reply=text;a.replyTime=t;if(a.status==='sent')a.status='seen';s.nightLogs.unshift({id:uid(),time:t,text:'Replied: "'+text+'"',who:'On-call staff'});L(s,'Night','On-call staff replied: "'+text+'"','On-call staff')});say('Reply sent to the parent.')},
    alertStatus(id,status,logText){const t=nowTime();up(s=>{const a=s.alerts.find(x=>x.id===id);a.status=status;if(status==='escalated'&&!a.reply){a.reply='Help is being arranged. Stay with your child and keep your phone close.';a.replyTime=t}const who=status==='resolved'&&logText.startsWith('Parent')?'Parent':'On-call staff';s.nightLogs.unshift({id:uid(),time:t,text:logText+' ('+issueOf(a.issue).label+(a.child?', '+a.child:'')+')',who});L(s,'Night',logText+' ('+issueOf(a.issue).label+')',who)});say(status==='resolved'?'Alert closed.':'Help arranged. The parent can see it.')},
    addHandover(h){up(s=>{s.handover.push({id:uid(),child:h.child,risk:h.risk,note:h.note.trim()});L(s,'Night','Handover note for '+h.child+' ('+h.risk+' risk)','Staff')});say('Care note added for tonight.')},
    removeHandover(id){up(s=>{s.handover=s.handover.filter(x=>x.id!==id)})},
  };
  const reset=()=>{const s=SEED();setSt(s);setConfirmReset(false);setMenu(false);say('Demo data restored.')};
  const role=ROLES.find(r=>r.id===st.role)||ROLES[1];
  const view={
    contributor:html`<${Contributor} st=${st} openDonate=${id=>setModal({type:'donate',id})}/>`,
    volunteer:html`<${Volunteer} st=${st} act=${act} setRole=${setRole} openWorkshop=${()=>setModal({type:'workshop'})}/>`,
    staff:html`<${Staff} st=${st} act=${act} openModal=${setModal} unlocked=${unlocked} unlock=${()=>{setUnlocked(true);say('Signed in to the staff side.')}} lock=${()=>setUnlocked(false)}/>`,
    parent:html`<${Parent} st=${st} act=${act} openModal=${setModal}/>`,
    night:html`<${Night} st=${st} act=${act} openModal=${setModal}/>`,
  }[role.id];
  const t=clock.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:true}).replace(/\s?[AP]M/,m=>' '+m.trim());

  return html`<div className="stage">
    <div className="device"><div className="notch"></div>
      <div className=${'app'+(low?' night':'')}>
        <div className="statusbar"><span>${t}</span><span className="r">5G <span className="batt"><i></i></span></span></div>
        <div className="scroll" ref=${scrollRef}>
          <header className="hdr">
            <div className="hdr-top">
              <div className="logo"><img src=${LOGO} alt=""/></div>
              <div className="brand"><b>Sahaay</b><small>Care System</small></div>
              <button className=${'ibtn'+(low?' ':'')} onClick=${()=>up(s=>{s.isLowLight=!low})} aria-label=${low?'Switch to day mode':'Switch to low-light mode'} title=${low?'Day mode':'Low-light mode'}><${Icon} n=${low?'sun':'moon'} s=${16}/></button>
              <button className=${'ibtn'+(menu?' hot':'')} onClick=${()=>{setMenu(!menu);setConfirmReset(false)}} aria-label="Switch role" aria-expanded=${menu}><${Icon} n=${menu?'x':'menu'} s=${16}/></button>
            </div>
            <div className="quote">"The fight to live, begins with a place to live."</div>
            <div className="mission"><span className="dot"></span>Active humanitarian mission</div>
            <div className="rolechip"><${Icon} n=${role.ic} s=${12}/>${role.label} view${low?html` · <span style=${{color:'var(--glow)'}}>Low-light</span>`:null}</div>
          </header>
          <main key=${role.id} style=${{animation:'fade .3s'}}>${view}</main>
        </div>
        ${menu&&html`<${React.Fragment}><div className="scrim" onClick=${()=>setMenu(false)}></div>
          <nav className="menu" style=${{top:window.innerWidth<=520?58:102}} aria-label="Select system role">
            <div className="menu-h"><span>Choose a role</span><i>Demo</i></div>
            ${ROLES.map(r=>html`<button key=${r.id} className=${'ropt'+(r.id===role.id?' on':'')} onClick=${()=>setRole(r.id)}>
              <span className="ic"><${Icon} n=${r.ic} s=${16}/></span><span><b>${r.label}${r.id===role.id?' •':''}</b><small>${r.sub}</small></span></button>`)}
            ${confirmReset?html`<div style=${{display:'flex',gap:8,padding:'8px 8px 2px',alignItems:'center',justifyContent:'center',fontSize:13,color:'#EAF4EE'}}>Restore demo data? <button className="btn sm" onClick=${reset}>Reset</button><button className="btn sm ghost" style=${{color:'#cfe3d7',borderColor:'#1d5a40'}} onClick=${()=>setConfirmReset(false)}>Cancel</button></div>`
              :html`<button className="reset" onClick=${()=>setConfirmReset(true)}><${Icon} n="rotate" s=${12}/>Reset demo data</button>`}
          </nav></${React.Fragment}>`}
        ${modal?.type==='donate'&&html`<${DonateSheet} need=${st.needs.find(n=>n.id===modal.id)} onClose=${()=>setModal(null)} onDonate=${act.donate}/>`}
        ${modal?.type==='workshop'&&html`<${WorkshopSheet} onClose=${()=>setModal(null)} onSubmit=${act.proposeWorkshop}/>`}
        ${modal?.type==='need'&&html`<${NeedSheet} onClose=${()=>setModal(null)} onSubmit=${act.postNeed}/>`}
        ${modal?.type==='repair'&&html`<${RepairSheet} onClose=${()=>setModal(null)} onSubmit=${act.addRepair}/>`}
        ${modal?.type==='aid'&&html`<${AidSheet} st=${st} preset=${modal.preset} byStaff=${modal.byStaff} onClose=${()=>setModal(null)} onSubmit=${act.requestAid}/>`}
        ${modal?.type==='callme'&&html`<${CallMeSheet} st=${st} onClose=${()=>setModal(null)} onSubmit=${act.callMe}/>`}
        ${modal?.type==='inout'&&html`<${InOutSheet} st=${st} onClose=${()=>setModal(null)} onSubmit=${act.invMove} onAdd=${act.invAdd}/>`}
        ${modal?.type==='poll'&&html`<${PollSheet} onClose=${()=>setModal(null)} onSubmit=${act.addPoll}/>`}
        ${modal?.type==='alert'&&html`<${AlertSheet} st=${st} onClose=${()=>setModal(null)} onSubmit=${act.raiseAlert}/>`}
        ${modal?.type==='guide'&&html`<${GuideSheet} id=${modal.id} onClose=${()=>setModal(null)} onAlert=${()=>setModal({type:'alert'})}/>`}
        ${toast&&html`<div className="toast" role="status"><${Icon} n="check" s=${16} w=${3}/>${toast}</div>`}
        <div className="homebar"></div>
      </div>
    </div>
    <div className="caption"><b>Sahaay Care System</b> · interactive prototype by Team Sahaay<br/>Tap ☰ to switch between Parent, Contributor, Volunteer, Staff and Night Care. Changes in one role show up in the others.<br/><a href="#query" style=${{color:'#dfe9e3',fontWeight:800}}>Open the website query form</a> · Staff demo PIN: 1234</div>
  </div>`;
}
function Root(){
  const [h,setH]=useState(location.hash);
  useEffect(()=>{const f=()=>{setH(location.hash);window.scrollTo(0,0)};window.addEventListener('hashchange',f);return()=>window.removeEventListener('hashchange',f)},[]);
  return h==='#query'?html`<${WebQuery}/>`:html`<${App}/>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${Root}/>`);
</script>

</body>
</html>
